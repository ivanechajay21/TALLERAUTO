services:
  mysql:
    image: mysql:8.0
    container_name: sigtm_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigtm_db
      MYSQL_USER: sigtm_user
      MYSQL_PASSWORD: sigtm_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sigtm_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sigtm_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - sigtm_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigtm_backend
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Lima
      - DB_URL=jdbc:mysql://mysql:3306/sigtm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=sigtm_user
      - DB_PASSWORD=sigtm_password
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - MAIL_HOST=${MAIL_HOST:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - UPLOAD_DIR=/app/uploads
      - CORS_ALLOWED_ORIGINS=*
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mysql
    networks:
      - sigtm_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sigtm_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sigtm_network
    restart: unless-stopped

volumes:
  mysql_data:
  uploads_data:

networks:
  sigtm_network:
    driver: bridge
